name: Something's wrong or out of date
description: A place has closed, moved, changed prices or has a broken link
labels: [correction]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Link to the page on the site
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong
      description: Include a link or say how you know, if you can.
    validations:
      required: true
